<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1B2A4A">
<meta name="description" content="DheMoney — kelola dompet Anda">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>DheMoney — Dompet</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <div class="page-header">
    <h1>Dompet</h1>
  </div>

  <div class="content" style="padding-top:16px;">
    <div id="walletList">
      <div class="loading-state">Memuat...</div>
    </div>

    <button class="btn-primary" id="addWalletBtn" style="margin-top:8px;">+ Tambah Dompet</button>
  </div>
</div>

<nav class="bottom-nav">
  <a class="nav-item" href="index.html"><span class="nav-icon">🏠</span>Dashboard</a>
  <a class="nav-item" href="transaksi.html"><span class="nav-icon">📋</span>Transaksi</a>
  <a class="nav-item active" href="dompet.html"><span class="nav-icon">👛</span>Dompet</a>
  <a class="nav-item" href="laporan.html"><span class="nav-icon">📊</span>Laporan</a>
</nav>

<!-- Sheet: Tambah Dompet -->
<div class="sheet-backdrop" id="walletSheet">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Tambah Dompet</div>
    <form id="walletForm">
      <div class="field">
        <label for="wNama">Nama Dompet</label>
        <input type="text" id="wNama" placeholder="misal: Jenius" required maxlength="40">
      </div>
      <div class="field">
        <label for="wTipe">Tipe</label>
        <select id="wTipe">
          <option value="Bank">Bank</option>
          <option value="E-Wallet">E-Wallet</option>
          <option value="Tunai">Tunai</option>
          <option value="Lainnya">Lainnya</option>
        </select>
      </div>
      <button type="submit" class="btn-primary">Simpan</button>
      <button type="button" class="btn-secondary" id="walletCancelBtn">Batal</button>
    </form>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/dompet.js"></script>
</body>
</html>
